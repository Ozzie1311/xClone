<html>
  <head>
    <!-- CSS -->
    <link rel="stylesheet" href="index.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- CDN Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <main>
      <section class="container home-container">
        <h1>Home</h1>
      </section>

      <section class="container tweet-container">
        <header class="profile-container">
          <img class="profile-img" src="images/scrimbalogo.png" alt="Logo of Scrimba" />
          <textarea name="tweet-input" id="tweet-input" placeholder="What is happening?"></textarea>
        </header>
        <footer class="tweet-footer">
          <div class="tweet-container_icons">
            <i class="fa-solid fa-image"></i>
            <i class="fa-solid fa-face-smile"></i>
            <i class="fa-solid fa-calendar"></i>
          </div>
          <button id="post-button">Post</button>
        </footer>
      </section>

      <section class="feed" id="feed"></section>

      <div class="overlay hidden-modal">
        <div class="confirm-inner">
          <p>Estas seguro de eliminar el tweet?</p>
          <div class="buttons">
            <button type="submit" id="accept-button">Aceptar</button>
            <button type="button" id="cancel-button">Cancelar</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
